services:
  - type: web
    name: print-suggester-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm --filter @print-suggester/api build
    startCommand: pnpm --filter @print-suggester/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: LOG_LEVEL
        value: info
